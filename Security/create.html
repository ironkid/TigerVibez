<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - TigerVibez</title>
    <link rel="stylesheet" href="Login.css">
</head>

<body>
    <div class="account-box">
        <div class="account-header">
            <header>Create Account</header>
        </div>
        <form id="create-account-form">
            <div class="input-box">
                <input type="text" id="new-username" class="input-field" placeholder="Username (e.g. j#)" required>
            </div>
            <div class="input-box">
                <input type="email" id="new-email" class="input-field" placeholder="Email" required>
            </div>
            <div class="input-box">
                <input type="password" id="new-password" class="input-field" placeholder="Password" required>
            </div>
            <div class="input-box">
                <input type="password" id="confirm-password" class="input-field" placeholder="Confirm Password" required>
            </div>
            <div class="input-submit">
                <button type="submit" class="submit-btn">Create Account</button>
            </div>
        </form>
        <div class="sign-in-link">
            <p>Already have an account? <a href="login.html">Sign In</a></p>
        </div>
    </div>

    <script>
        document.getElementById("create-account-form").addEventListener("submit", function (e) {
            e.preventDefault(); // Prevent form submission

            const username = document.getElementById("new-username").value;
            const email = document.getElementById("new-email").value;
            const password = document.getElementById("new-password").value;
            const confirmPassword = document.getElementById("confirm-password").value;

            if (password !== confirmPassword) {
                alert("Passwords do not match. Please try again.");
                return;
            }

            // Save user data (Warning: localStorage is not secure for storing passwords!)
            localStorage.setItem("username", username);
            localStorage.setItem("email", email);
            localStorage.setItem("password", password);

            alert("Account created successfully! Please log in.");
            window.location.href = "login.html"; // Redirect to login page
        });
    </script>
</body>

</html>
