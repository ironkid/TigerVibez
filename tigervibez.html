<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>TigerVibez</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <main>
            <nav class="navbar">
                <h1>TigerVibez</h1>
                <li class="logo"><img src="pictures/tiger.png"></li>
                <section>
                    <div class="search">
                        <input type="text" class="search" id="searchInput" placeholder="Search...">
                        <button class="search-button" onclick="searchFile()">Search</button>
                    </div>
                </section>
            </nav>
        </main>
        <canvas id="bouncingCanvas"></canvas>
        <footer>
        </footer>
        <script>
            const canvas = document.getElementById("bouncingCanvas");
            const ctx = canvas.getContext("2d");

            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight - 70; // Adjust height for navbar

            const ballCount = 14; 
            const balls = [];
            const departmentNames = [
                "Department of Art", "Department of Accounting", "Department of Business",
                "Department of English", "Department of Criminal Justice", "Department of Computer Science",
                "Department of Civil Engineering", "Department of Health Science", "Department of Social Justice",
                "Department of Counciling", "Department of Mathematics","Department of Chemistry","Department of Biology",
                "Department of Human Development"
            ];

            const pages = {
    "department of art": "Department/DeptArt.html",
    "department of accounting": "Department/DeptAcco.html",
    "department of business": "Department/DeptBusi.html",
    "department of english": "Department/DeptEngl.html",
    "department of criminal justice": "Department/DeptofCJ.html",
    "department of computer science": "Department/DeptofCS.html",
    "department of civil engineering": "Department/DeptofCE.html",
    "department of health science": "Department/DeptofHS.html",
    "department of social justice": "Department/DeptofSJ.html",
    "department of Counciling": "Department/DeptCoun.html",
    "department of mathematics": "Department/DeptMath.html",
    "department of chemistry": "Department/DeptChem.html",
    "department of biology": "Department/DeptBio.html",
    "department of human development": "Department/DeptHD.html"

};

            function getDistance(x1, y1, x2, y2) {
                
                return Math.sqrt((x2 - x1) ** 2 + (y2 - y1) ** 2);
            }

            class Ball {
                constructor(x, y, radius, color, dx, dy, name) {
                    this.x = x;
                    this.y = y;
                    this.radius = radius;
                    this.color = color;
                    this.dx = dx; 
                    this.dy = dy; 
                    this.name = name; 
                    this.hover = false; 
                }

                draw() {
                    const gradient = ctx.createRadialGradient(
                        this.x, this.y, this.radius * 0.5,
                        this.x, this.y, this.radius
                    );

                    gradient.addColorStop(0, "rgba(255, 255, 255, 0.7)"); 
                    gradient.addColorStop(0.5, this.color);
                    gradient.addColorStop(1, "rgba(0, 0, 0, 0.5)"); 

                    ctx.beginPath();
                    ctx.arc(this.x + 5, this.y + 5, this.radius, 0, Math.PI * 2);
                    ctx.fillStyle = "rgba(0, 0, 0, 0.3)";
                    ctx.fill();
                    ctx.closePath();

                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                    ctx.fillStyle = gradient;
                    ctx.fill();
                    ctx.closePath();

                    ctx.beginPath();
                    ctx.arc(this.x - this.radius * 0.3, this.y - this.radius * 0.3, this.radius * 0.2, 0, Math.PI * 2);
                    ctx.fillStyle = "rgba(255, 255, 255, 0.5)";
                    ctx.fill();
                    ctx.closePath();

                    if (this.hover) {
                        ctx.fillStyle = "Black";
                        ctx.font = "14px Arial";
                        ctx.textAlign = "center";
                        ctx.textBaseline = "middle";
                        ctx.fillText(this.name, this.x, this.y);
                    }
                }

                update(balls) {
                    if (this.x + this.radius >= canvas.width || this.x - this.radius <= 0) {
                        this.dx *= -0.98;
                    }
                    if (this.y + this.radius >= canvas.height || this.y - this.radius <= 0) {
                        this.dy *= -0.98;
                    }

                    this.dx *= 0.995;
                    this.dy *= 0.995;

                    this.x += this.dx;
                    this.y += this.dy;

                    for (let i = 0; i < balls.length; i++) {
                        if (this === balls[i]) continue;
                        let dx = this.x - balls[i].x;
                        let dy = this.y - balls[i].y;
                        let distance = getDistance(this.x, this.y, balls[i].x, balls[i].y);

                        if (distance < this.radius + balls[i].radius) {
                            let angle = Math.atan2(dy, dx);
                            let speed1 = Math.sqrt(this.dx ** 2 + this.dy ** 2);
                            let speed2 = Math.sqrt(balls[i].dx ** 2 + balls[i].dy ** 2);

                            this.dx = speed2 * Math.cos(angle);
                            this.dy = speed2 * Math.sin(angle);
                            balls[i].dx = speed1 * Math.cos(angle + Math.PI);
                            balls[i].dy = speed1 * Math.sin(angle + Math.PI);
                        }
                    }

                    this.draw();
                }

                checkHover(mouseX, mouseY) {
                    const distance = getDistance(this.x, this.y, mouseX, mouseY);
                    this.hover = distance < this.radius;
                }
            }

            function init() {
                for (let i = 0; i < ballCount; i++) {
                    let radius = 105; 
                    let x, y;
                    let safe = false;

                    while (!safe) {
                        x = Math.random() * (canvas.width - radius * 2) + radius;
                        y = Math.random() * (canvas.height - radius * 2) + radius;
                        safe = balls.every(ball => getDistance(x, y, ball.x, ball.y) > radius * 2);
                    }

                    let color = `hsl(${Math.random() * 360}, 100%, 50%)`;
                    let dx = (Math.random() - 0.5) * 4;
                    let dy = (Math.random() - 0.5) * 4;

                    balls.push(new Ball(x, y, radius, color, dx, dy, departmentNames[i]));
                }
            }

            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                balls.forEach(ball => ball.update(balls));
                requestAnimationFrame(animate);
            }

            canvas.addEventListener('mousemove', (event) => {
                const rect = canvas.getBoundingClientRect();
                const mouseX = event.clientX - rect.left;
                const mouseY = event.clientY - rect.top;

                balls.forEach(ball => ball.checkHover(mouseX, mouseY));
            });

            function searchFile() {
                let input = document.getElementById("searchInput").value.toLowerCase();
                if (pages[input]) {
                    window.location.href = pages[input];
                } else {
                    let result = document.getElementById("result");
                    result.innerHTML = "File not found.";
                    result.style.color = "red";
                }
            }

            canvas.addEventListener('click', (event) => {
                const rect = canvas.getBoundingClientRect();
                const mouseX = event.clientX - rect.left;
                const mouseY = event.clientY - rect.top;

                balls.forEach(ball => {
                    if (getDistance(mouseX, mouseY, ball.x, ball.y) < ball.radius) {
                        const targetPage = pages[ball.name.toLowerCase()];
                        if (targetPage) {
                            window.location.href = targetPage;
                        }
                    }
                });
            });

            init();
            animate();
        </script>
    </body>
</html>
